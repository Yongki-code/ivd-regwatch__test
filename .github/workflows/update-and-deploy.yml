name: Update MDCG Feed and Deploy Pages

on:
  workflow_dispatch:
    inputs:
      skip_collect:
        description: "Deploy committed public/data/mdcg-cache.json without collecting live feeds"
        required: false
        default: "false"
      force_ai:
        description: "Re-run AI summary/action for collected items even if cached items already have AI output"
        required: false
        default: "false"
  schedule:
    - cron: "0 22 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Collect MDCG RSS
        if: ${{ github.event.inputs.skip_collect != 'true' }}
        run: node scripts/collect-mdcg.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          AI_ENRICH_LIMIT: 12
          FORCE_AI_REENRICH: ${{ github.event.inputs.force_ai }}

      - name: Commit collected cache
        if: ${{ github.event.inputs.skip_collect != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/data/mdcg-cache.json
          if git diff --cached --quiet; then
            echo "No cache changes to commit."
          else
            git commit -m "Update regulatory data cache"
            git push
          fi

      - name: Publish source config
        run: |
          mkdir -p public/config
          cp config/sources.json public/config/sources.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
