<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IVD RegWatch</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <aside class="sidebar" aria-label="필터 및 설정">
      <div class="brand">
        <h1>IVD RegWatch</h1>
        <p>규제 자동 모니터링</p>
      </div>

      <section class="filter-group">
        <h2>지역 필터</h2>
        <label class="check-row">
          <input type="checkbox" checked data-filter="region" value="EU" />
          <span>EU</span>
        </label>
      </section>

      <section class="filter-group">
        <h2>문서 유형</h2>
        <label class="check-row">
          <input type="checkbox" checked data-filter="type" value="Guidance" />
          <span>Guidance</span>
        </label>
        <label class="check-row">
          <input type="checkbox" checked data-filter="type" value="MDCG Guidance" />
          <span>MDCG Guidance</span>
        </label>
      </section>

      <section class="filter-group status-block">
        <h2>수집 현황</h2>
        <dl>
          <div>
            <dt>마지막 수집</dt>
            <dd id="lastCollected">-</dd>
          </div>
          <div>
            <dt>누적 수집</dt>
            <dd><span id="totalCount">0</span>건</dd>
          </div>
          <div>
            <dt>수집 방식</dt>
            <dd id="collectionMode">RSS</dd>
          </div>
        </dl>
      </section>

      <div class="sidebar-footer">
        <p><span class="dot muted"></span> API 미설정</p>
        <p><span class="dot success"></span> MDCG 연결</p>
        <button class="settings-button" id="settingsButton" type="button" aria-label="설정 열기">
          <span aria-hidden="true">⚙</span>
          설정
        </button>
      </div>
    </aside>

    <main class="app-shell">
      <header class="topbar">
        <div class="title-row">
          <h2>최신 규제 업데이트</h2>
          <span class="count-pill" id="visibleCount">0</span>
        </div>
        <label class="search-box" aria-label="제목 또는 요약 검색">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="제목·요약 검색" />
        </label>
      </header>

      <section class="metrics" aria-label="수집 지표">
        <article class="metric-card">
          <strong id="todayCount">0</strong>
          <span>오늘 수집</span>
        </article>
        <article class="metric-card alert">
          <strong id="highCount">0</strong>
          <span>이번 주 High</span>
        </article>
        <article class="metric-card warn">
          <strong id="unreadCount">0</strong>
          <span>미열람</span>
        </article>
      </section>

      <section class="toolbar" aria-label="목록 제어">
        <div class="segmented" role="group" aria-label="심각도 필터">
          <button type="button" class="active" data-severity="all">전체</button>
          <button type="button" data-severity="high">긴급</button>
          <button type="button" data-severity="medium">중요</button>
          <button type="button" data-severity="low">참고</button>
        </div>
        <button class="primary-action" id="refreshButton" type="button">지금 수집 실행</button>
      </section>

      <section class="feed-list" id="feedList" aria-live="polite"></section>
    </main>

    <aside class="detail-panel" id="detailPanel" aria-hidden="true">
      <button class="icon-button close-detail" id="closeDetail" type="button" aria-label="상세 닫기">×</button>
      <div id="detailContent"></div>
    </aside>

    <div class="modal-backdrop" id="settingsModal" aria-hidden="true">
      <section class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <button class="icon-button modal-close" id="closeSettings" type="button" aria-label="설정 닫기">×</button>
        <h2 id="settingsTitle">설정</h2>
        <label>
          MDCG RSS URL
          <input id="rssUrlInput" type="url" readonly value="https://health.ec.europa.eu/node/12916/rss_en" />
        </label>
        <p class="hint">서버 환경변수 <code>MDCG_RSS_URL</code>로 수집 대상을 바꿀 수 있습니다.</p>
        <div class="divider"></div>
        <h3>데이터 수집 설정</h3>
        <label>
          자동 수집 시간
          <input type="text" value="매일 오전 7시 (KST)" readonly />
        </label>
        <button class="primary-action wide" id="modalRefresh" type="button">지금 수집 실행</button>
        <p class="live-status"><span class="dot success"></span> 브라우저 접속 시 최신 RSS를 다시 수집합니다.</p>
        <div class="modal-actions">
          <button class="ghost-button" id="cancelSettings" type="button">취소</button>
          <button class="primary-action" id="saveSettings" type="button">저장</button>
        </div>
      </section>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
